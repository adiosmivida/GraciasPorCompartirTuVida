<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi última confesión...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07070b;
            --bg-gradient: radial-gradient(circle at 50% 35%, #1a1829 0%, #09090f 70%, #050508 100%);
            --text-primary: #f0ece1;
            --text-secondary: #a8a29e;
            --accent: #d4b499;
            --accent-glow: rgba(212, 180, 153, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            font-family: 'Cormorant Garamond', Georgia, serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
        }

        /* Ambient stars/particles canvas */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Subtle vignette */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Floating music control button */
        .music-control {
            position: fixed;
            top: 28px;
            right: 28px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 180, 153, 0.2);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 1.5px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.4s ease;
        }

        .music-control:hover {
            background: rgba(212, 180, 153, 0.12);
            border-color: var(--accent);
            color: var(--text-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .music-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
        }

        .music-bars span {
            width: 2px;
            background: var(--accent);
            border-radius: 1px;
            height: 3px;
            transition: height 0.2s ease;
        }

        .music-control.playing .music-bars span:nth-child(1) {
            animation: bounce 0.8s infinite ease-in-out;
        }
        .music-control.playing .music-bars span:nth-child(2) {
            animation: bounce 0.8s infinite ease-in-out 0.2s;
        }
        .music-control.playing .music-bars span:nth-child(3) {
            animation: bounce 0.8s infinite ease-in-out 0.4s;
        }

        @keyframes bounce {
            0%, 100% { height: 3px; }
            50% { height: 12px; }
        }

        /* Main Card Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 760px;
            width: 90%;
            padding: 50px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
        }

        .decorative-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.6;
        }

        .message-box {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typewriter-text {
            font-size: clamp(1.6rem, 3.8vw, 2.5rem);
            line-height: 1.55;
            font-weight: 400;
            font-style: italic;
            color: var(--text-primary);
            text-shadow: 0 2px 20px rgba(255, 255, 255, 0.08);
            letter-spacing: 0.4px;
        }

        .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(10px);
            filter: blur(4px);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            margin-right: 0.28em;
        }

        .word.visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        /* Buttons container - hidden until text finishes */
        .buttons-container {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            transform: translateY(18px);
            pointer-events: none;
            transition: opacity 1.4s ease, transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .buttons-container.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            padding: 15px 38px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: rgba(212, 180, 153, 0.14);
            color: var(--text-primary);
            border: 1px solid rgba(212, 180, 153, 0.55);
            box-shadow: 0 4px 25px rgba(212, 180, 153, 0.12);
        }

        .btn-primary:hover {
            background: rgba(212, 180, 153, 0.28);
            border-color: var(--accent);
            box-shadow: 0 6px 35px rgba(212, 180, 153, 0.32);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        /* Goodbye screen when "Cerrar ventana" is clicked */
        .closed-overlay {
            position: fixed;
            inset: 0;
            background: #030305;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            text-align: center;
            padding: 24px;
        }

        .closed-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .closed-overlay p {
            font-size: 1.5rem;
            font-style: italic;
            color: var(--text-secondary);
            max-width: 480px;
            line-height: 1.6;
        }

        /* =========================================================================
           DISEÑO RESPONSIVO PARA TELÉFONOS MÓVILES (SIN PERDER LA ESENCIA)
           ========================================================================= */
        @media (max-width: 768px) {
            body, html {
                min-height: 100dvh;
                height: auto;
                overflow-y: auto;
                padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
            }

            .music-control {
                top: calc(18px + env(safe-area-inset-top, 0px));
                right: 18px;
                padding: 8px 14px;
                font-size: 0.72rem;
                letter-spacing: 1.2px;
            }

            .container {
                width: 94%;
                padding: 40px 22px;
                gap: 34px;
                margin: auto;
            }

            .decorative-line {
                width: 48px;
            }

            .message-box {
                min-height: 120px;
                padding: 0 4px;
            }

            .typewriter-text {
                font-size: clamp(1.45rem, 5.5vw, 1.95rem);
                line-height: 1.65;
                letter-spacing: 0.3px;
            }

            .buttons-container {
                flex-direction: column;
                width: 100%;
                max-width: 280px;
                gap: 16px;
            }

            .btn {
                width: 100%;
                text-align: center;
                padding: 15px 28px;
                font-size: 0.8rem;
                letter-spacing: 2px;
                -webkit-tap-highlight-color: transparent;
            }

            .closed-overlay p {
                font-size: 1.3rem;
                padding: 0 12px;
            }
        }

        @media (max-width: 390px) {
            .container {
                padding: 28px 16px;
                gap: 28px;
            }

            .typewriter-text {
                font-size: 1.35rem;
                line-height: 1.6;
            }

            .btn {
                padding: 13px 22px;
                font-size: 0.75rem;
            }
        }

        /* En caso de girar el teléfono en horizontal (landscape) */
        @media (max-height: 540px) and (orientation: landscape) {
            .container {
                padding: 24px 20px;
                gap: 20px;
            }
            .message-box {
                min-height: 70px;
            }
            .typewriter-text {
                font-size: 1.35rem;
            }
            .buttons-container {
                flex-direction: row;
                max-width: none;
            }
            .btn {
                width: auto;
                padding: 11px 24px;
            }
        }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>
    <div class="vignette"></div>

    <!-- =========================================================================
         MÚSICA DE FONDO (SIEMPRE ACTIVA POR DEFAULT Y EN LOOP)
         Soporta tanto .mp4 como .mp3 (cambia el nombre si usas otro archivo)
         ========================================================================= -->
    <audio id="bg-music" autoplay loop preload="auto">
        <source src="musica_index.mp4" type="audio/mp4">
        <source src="musica_index.mp3" type="audio/mpeg">
    </audio>

    <button id="music-btn" class="music-control playing" title="Silenciar / Activar sonido">
        <div class="music-bars">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <span id="music-label">Silenciar</span>
    </button>

    <main class="container">
        <div class="decorative-line"></div>

        <div class="message-box">
            <p id="confession-text" class="typewriter-text"></p>
        </div>

        <div id="buttons" class="buttons-container">
            <a href="Despedida.html" class="btn btn-primary">Leer / Continuar</a>
            <button id="close-btn" class="btn btn-secondary">Cerrar ventana</button>
        </div>

        <div class="decorative-line"></div>
    </main>

    <div id="closed-screen" class="closed-overlay">
        <p>Está bien, respeto tu decisión.<br>Cuídate mucho y que tengas una linda vida. :)</p>
    </div>

    <script>
        // =========================================================================
        // CONFIGURACIÓN DE LA FRASE Y VELOCIDAD
        // =========================================================================
        const frase = 'Aquí esta mi ultima confesión, dale en continuar para leer todo si te sientes bien con esto... :)';
        const tiempoEntrePalabrasMs = 340; // Milisegundos entre cada palabra

        const textContainer = document.getElementById('confession-text');
        const buttonsContainer = document.getElementById('buttons');
        const closeBtn = document.getElementById('close-btn');
        const closedScreen = document.getElementById('closed-screen');

        // Dividir la frase en palabras y crear spans para animarlas una por una
        const palabras = frase.split(' ');
        palabras.forEach((palabra) => {
            const span = document.createElement('span');
            span.className = 'word';
            span.textContent = palabra;
            textContainer.appendChild(span);
        });

        const wordSpans = document.querySelectorAll('.word');

        function revelarPalabras() {
            wordSpans.forEach((span, index) => {
                setTimeout(() => {
                    span.classList.add('visible');

                    // Cuando la última palabra ha aparecido, mostramos los botones
                    if (index === wordSpans.length - 1) {
                        setTimeout(() => {
                            buttonsContainer.classList.add('show');
                        }, 700);
                    }
                }, 600 + index * tiempoEntrePalabrasMs);
            });
        }

        window.addEventListener('DOMContentLoaded', revelarPalabras);

        // =========================================================================
        // BOTÓN PARA CERRAR LA VENTANA
        // =========================================================================
        closeBtn.addEventListener('click', () => {
            bgMusic.pause();
            // Intenta cerrar la pestaña del navegador
            window.open('', '_self', '');
            window.close();

            // Si el navegador bloquea window.close() por seguridad, muestra pantalla de despedida y redirige
            setTimeout(() => {
                closedScreen.classList.add('active');
                setTimeout(() => {
                    window.location.href = 'about:blank';
                }, 3200);
            }, 200);
        });

        // =========================================================================
        // CONTROL DE MÚSICA DE FONDO EN LOOP (SIEMPRE ACTIVA POR DEFAULT, DESDE SEGUNDO 0)
        // Nota: el archivo musica_index.mp4 ya fue recortado exactamente desde el segundo 32,
        // por lo que arranca de inmediato en el segundo 0.0 sin retraso.
        // =========================================================================
        const bgMusic = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        const musicLabel = document.getElementById('music-label');

        bgMusic.volume = 1.0; // Volumen al 100% por default
        bgMusic.muted = false; // Activa con sonido por default

        function actualizarEstadoBotonMute() {
            if (!bgMusic.muted) {
                musicBtn.classList.add('playing');
                musicLabel.textContent = 'Silenciar';
            } else {
                musicBtn.classList.remove('playing');
                musicLabel.textContent = 'Activar sonido';
            }
        }

        function intentarReproducir() {
            bgMusic.muted = false;
            bgMusic.volume = 1.0;
            const promesa = bgMusic.play();
            if (promesa !== undefined) {
                promesa.then(() => {
                    actualizarEstadoBotonMute();
                }).catch(() => {
                    // Si el navegador aún no permite audio hasta detectar movimiento/foco,
                    // seguimos reintentando automáticamente
                });
            }
        }

        // Intentar reproducir desde el primer milisegundo en que existe el script
        intentarReproducir();
        bgMusic.addEventListener('canplay', intentarReproducir, { once: true });
        window.addEventListener('DOMContentLoaded', intentarReproducir);
        window.addEventListener('load', intentarReproducir);
        window.addEventListener('focus', () => {
            if (bgMusic.paused) intentarReproducir();
        });

        // Además, al mínimo movimiento del mouse, rueda, cursor o toque sobre la ventana,
        // se activa instantáneamente si el navegador lo retuvo al abrir la pestaña:
        const eventosDesbloqueo = ['mousemove', 'mousedown', 'pointermove', 'pointerdown', 'touchstart', 'keydown', 'wheel'];
        function desbloquearAlInstante(e) {
            if (e.target && e.target.closest && e.target.closest('#close-btn')) return;
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    actualizarEstadoBotonMute();
                    eventosDesbloqueo.forEach(ev => window.removeEventListener(ev, desbloquearAlInstante));
                }).catch(() => {});
            } else {
                eventosDesbloqueo.forEach(ev => window.removeEventListener(ev, desbloquearAlInstante));
            }
        }
        eventosDesbloqueo.forEach(ev => window.addEventListener(ev, desbloquearAlInstante, { passive: true }));

        // El único botón solo silencia o reactiva el sonido (la música sigue corriendo siempre)
        musicBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.muted = false;
                bgMusic.play().catch(() => {});
            } else {
                bgMusic.muted = !bgMusic.muted;
            }
            actualizarEstadoBotonMute();
        });

        // =========================================================================
        // PARTÍCULAS DE FONDO (LUCES SUAVES FLOTANDO)
        // =========================================================================
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = -(Math.random() * 0.35 + 0.1);
                this.speedX = (Math.random() - 0.5) * 0.25;
                this.alpha = Math.random() * 0.45 + 0.05;
                this.fadeSpeed = Math.random() * 0.004 + 0.001;
                this.growing = Math.random() > 0.5;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.growing) {
                    this.alpha += this.fadeSpeed;
                    if (this.alpha >= 0.55) this.growing = false;
                } else {
                    this.alpha -= this.fadeSpeed;
                    if (this.alpha <= 0.05) this.growing = true;
                }

                if (this.y < -20) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 180, 153, ${this.alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(212, 180, 153, 0.5)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 55; i++) {
            particlesArray.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
