<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi última confesión...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07070b;
            --bg-gradient: radial-gradient(circle at 50% 35%, #1a1829 0%, #09090f 70%, #050508 100%);
            --text-primary: #f0ece1;
            --text-secondary: #a8a29e;
            --accent: #d4b499;
            --accent-glow: rgba(212, 180, 153, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            font-family: 'Cormorant Garamond', Georgia, serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
        }

        /* Ambient stars/particles canvas */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Subtle vignette */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Floating music control button */
        .music-control {
            position: fixed;
            top: 28px;
            right: 28px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 180, 153, 0.2);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 1.5px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.4s ease;
        }

        .music-control:hover {
            background: rgba(212, 180, 153, 0.12);
            border-color: var(--accent);
            color: var(--text-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .music-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
        }

        .music-bars span {
            width: 2px;
            background: var(--accent);
            border-radius: 1px;
            height: 3px;
            transition: height 0.2s ease;
        }

        .music-control.playing .music-bars span:nth-child(1) {
            animation: bounce 0.8s infinite ease-in-out;
        }
        .music-control.playing .music-bars span:nth-child(2) {
            animation: bounce 0.8s infinite ease-in-out 0.2s;
        }
        .music-control.playing .music-bars span:nth-child(3) {
            animation: bounce 0.8s infinite ease-in-out 0.4s;
        }

        @keyframes bounce {
            0%, 100% { height: 3px; }
            50% { height: 12px; }
        }

        /* Main Card Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 760px;
            width: 90%;
            padding: 50px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
        }

        .decorative-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.6;
        }

        .message-box {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typewriter-text {
            font-size: clamp(1.6rem, 3.8vw, 2.5rem);
            line-height: 1.55;
            font-weight: 400;
            font-style: italic;
            color: var(--text-primary);
            text-shadow: 0 2px 20px rgba(255, 255, 255, 0.08);
            letter-spacing: 0.4px;
        }

        .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(10px);
            filter: blur(4px);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            margin-right: 0.28em;
        }

        .word.visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        /* Buttons container - hidden until text finishes */
        .buttons-container {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            transform: translateY(18px);
            pointer-events: none;
            transition: opacity 1.4s ease, transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .buttons-container.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            padding: 15px 38px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: rgba(212, 180, 153, 0.14);
            color: var(--text-primary);
            border: 1px solid rgba(212, 180, 153, 0.55);
            box-shadow: 0 4px 25px rgba(212, 180, 153, 0.12);
        }

        .btn-primary:hover {
            background: rgba(212, 180, 153, 0.28);
            border-color: var(--accent);
            box-shadow: 0 6px 35px rgba(212, 180, 153, 0.32);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        /* Goodbye / Breather screen when "Tomar un respiro" is clicked */
        .closed-overlay {
            position: fixed;
            inset: 0;
            background: #030305;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.4s ease;
            text-align: center;
            padding: 24px;
        }

        .closed-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .closed-overlay p {
            font-size: 1.5rem;
            font-style: italic;
            color: var(--text-secondary);
            max-width: 520px;
            line-height: 1.65;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .closed-overlay.show-msg p {
            opacity: 1;
            transform: translateY(0);
        }

        /* Fullscreen Video Scene after message fades */
        .video-scene {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 110;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.8s ease;
            overflow: hidden;
        }

        .video-scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        .video-scene video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Top message banner over video (disappears after 25s) */
        .respiro-top-msg {
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 120;
            width: 90%;
            max-width: 780px;
            background: rgba(7, 7, 11, 0.72);
            border: 1px solid rgba(212, 180, 153, 0.35);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            text-align: center;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-style: italic;
            line-height: 1.55;
            color: var(--text-primary);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
            opacity: 0;
            transition: opacity 1.5s ease, transform 1.5s ease;
            pointer-events: none;
        }

        .respiro-top-msg.visible {
            opacity: 1;
        }

        /* =========================================================================
           DISEÑO RESPONSIVO PARA TELÉFONOS MÓVILES (SIN PERDER LA ESENCIA)
           ========================================================================= */
        @media (max-width: 768px) {
            body, html {
                min-height: 100dvh;
                height: auto;
                overflow-y: auto;
                padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
            }

            .music-control {
                top: calc(18px + env(safe-area-inset-top, 0px));
                right: 18px;
                padding: 8px 14px;
                font-size: 0.72rem;
                letter-spacing: 1.2px;
                z-index: 130;
            }

            .container {
                width: 94%;
                padding: 40px 22px;
                gap: 34px;
                margin: auto;
            }

            .decorative-line {
                width: 48px;
            }

            .message-box {
                min-height: 120px;
                padding: 0 4px;
            }

            .typewriter-text {
                font-size: clamp(1.45rem, 5.5vw, 1.95rem);
                line-height: 1.65;
                letter-spacing: 0.3px;
            }

            .buttons-container {
                flex-direction: column;
                width: 100%;
                max-width: 280px;
                gap: 16px;
            }

            .btn {
                width: 100%;
                text-align: center;
                padding: 15px 28px;
                font-size: 0.8rem;
                letter-spacing: 2px;
                -webkit-tap-highlight-color: transparent;
            }

            .closed-overlay p {
                font-size: 1.3rem;
                padding: 0 12px;
            }

            /* En teléfono: que el video se acomode bien y ocupe la mayor parte de la pantalla */
            .video-scene {
                justify-content: center;
                background: radial-gradient(circle at center, #0e0e18 0%, #000000 100%);
            }

            .video-scene video {
                width: 100%;
                height: 82dvh;
                max-height: 100dvh;
                object-fit: cover;
                object-position: center;
                border-top: 1px solid rgba(212, 180, 153, 0.18);
                border-bottom: 1px solid rgba(212, 180, 153, 0.18);
                box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
            }

            .respiro-top-msg {
                top: calc(64px + env(safe-area-inset-top, 0px));
                width: 92%;
                padding: 16px 20px;
                font-size: 1.18rem;
                line-height: 1.5;
            }
        }

        @media (max-width: 390px) {
            .container {
                padding: 28px 16px;
                gap: 28px;
            }

            .typewriter-text {
                font-size: 1.35rem;
                line-height: 1.6;
            }

            .btn {
                padding: 13px 22px;
                font-size: 0.75rem;
            }
        }

        /* En caso de girar el teléfono en horizontal (landscape) */
        @media (max-height: 540px) and (orientation: landscape) {
            .container {
                padding: 24px 20px;
                gap: 20px;
            }
            .message-box {
                min-height: 70px;
            }
            .typewriter-text {
                font-size: 1.35rem;
            }
            .buttons-container {
                flex-direction: row;
                max-width: none;
            }
            .btn {
                width: auto;
                padding: 11px 24px;
            }
        }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>
    <div class="vignette"></div>

    <!-- =========================================================================
         MÚSICA DE FONDO (SIEMPRE ACTIVA POR DEFAULT Y EN LOOP)
         Soporta tanto .mp4 como .mp3 (cambia el nombre si usas otro archivo)
         ========================================================================= -->
    <audio id="bg-music" autoplay loop preload="auto">
        <source src="musica_index.mp4" type="audio/mp4">
        <source src="musica_index.mp3" type="audio/mpeg">
    </audio>

    <button id="music-btn" class="music-control playing" title="Silenciar / Activar sonido">
        <div class="music-bars">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <span id="music-label">Silenciar</span>
    </button>

    <main class="container">
        <div class="decorative-line"></div>

        <div class="message-box">
            <p id="confession-text" class="typewriter-text"></p>
        </div>

        <div id="buttons" class="buttons-container">
            <a href="Despedida.html" class="btn btn-primary">Leer / Continuar</a>
            <button id="close-btn" class="btn btn-secondary">Tomar un respiro</button>
        </div>

        <div class="decorative-line"></div>
    </main>

    <!-- Pantalla en negro con mensaje que aparece y desaparece -->
    <div id="closed-screen" class="closed-overlay">
        <p id="closed-msg">Está bien, respeto tu decisión.<br>Cuídate mucho y que tengas una linda vida. :)</p>
    </div>

    <!-- Escena del video en pantalla completa (sin sonido propio) y su música dedicada -->
    <div id="video-scene" class="video-scene">
        <div id="respiro-top-msg" class="respiro-top-msg">
            Esta bien tomarse un respiro y pensar las cosas, todos necesitamos espacio aunque se sienta solitario, esta sera mi ultima acción por ti
        </div>
        <video id="respiro-video" src="video_respiro.mp4" muted loop playsinline preload="auto"></video>
    </div>

    <audio id="respiro-music" src="musica_respiro.mp4" loop preload="auto"></audio>

    <script>
        // =========================================================================
        // CONFIGURACIÓN DE LA FRASE Y VELOCIDAD
        // =========================================================================
        const frase = 'Aquí esta mi ultima confesión, dale en continuar para leer todo si te sientes bien con esto... :)';
        const tiempoEntrePalabrasMs = 340; // Milisegundos entre cada palabra

        const textContainer = document.getElementById('confession-text');
        const buttonsContainer = document.getElementById('buttons');
        const closeBtn = document.getElementById('close-btn');
        const closedScreen = document.getElementById('closed-screen');

        // Dividir la frase en palabras y crear spans para animarlas una por una
        const palabras = frase.split(' ');
        palabras.forEach((palabra) => {
            const span = document.createElement('span');
            span.className = 'word';
            span.textContent = palabra;
            textContainer.appendChild(span);
        });

        const wordSpans = document.querySelectorAll('.word');

        function revelarPalabras() {
            wordSpans.forEach((span, index) => {
                setTimeout(() => {
                    span.classList.add('visible');

                    // Cuando la última palabra ha aparecido, mostramos los botones
                    if (index === wordSpans.length - 1) {
                        setTimeout(() => {
                            buttonsContainer.classList.add('show');
                        }, 700);
                    }
                }, 600 + index * tiempoEntrePalabrasMs);
            });
        }

        window.addEventListener('DOMContentLoaded', revelarPalabras);

        // =========================================================================
        // CONTROL DE AUDIO UNIFICADO (SIN SOBREPOSICIÓN ENTRE INDEX Y RESPIRO)
        // =========================================================================
        const bgMusic = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        const musicLabel = document.getElementById('music-label');
        const videoScene = document.getElementById('video-scene');
        const respiroVideo = document.getElementById('respiro-video');
        const respiroMusic = document.getElementById('respiro-music');
        const respiroTopMsg = document.getElementById('respiro-top-msg');

        let modoRespiroActivo = false;
        let estadoSilenciado = false;

        bgMusic.volume = 1.0;
        bgMusic.muted = false;
        respiroMusic.volume = 1.0;
        respiroMusic.muted = false;

        const eventosDesbloqueo = ['click', 'mousedown', 'pointerdown', 'touchstart', 'keydown'];

        function eliminarEventosDesbloqueo() {
            eventosDesbloqueo.forEach(ev => window.removeEventListener(ev, desbloquearAlInstante));
        }

        // Destruye por completo el audio del index para que jamás pueda volver a sonar ni mezclarse
        function detenerYDestruirAudioIndex() {
            eliminarEventosDesbloqueo();
            try {
                bgMusic.pause();
                bgMusic.currentTime = 0;
                bgMusic.muted = true;
                bgMusic.removeAttribute('src');
                while (bgMusic.firstChild) {
                    bgMusic.removeChild(bgMusic.firstChild);
                }
                bgMusic.load();
            } catch (err) {}
        }

        function actualizarEstadoBotonMute() {
            if (!estadoSilenciado) {
                musicBtn.classList.add('playing');
                musicLabel.textContent = 'Silenciar';
            } else {
                musicBtn.classList.remove('playing');
                musicLabel.textContent = 'Activar sonido';
            }
        }

        function intentarReproducirIndex() {
            if (modoRespiroActivo) return;
            bgMusic.muted = estadoSilenciado;
            bgMusic.volume = 1.0;
            const promesa = bgMusic.play();
            if (promesa !== undefined) {
                promesa.then(() => {
                    if (modoRespiroActivo) {
                        detenerYDestruirAudioIndex();
                        return;
                    }
                    actualizarEstadoBotonMute();
                    eliminarEventosDesbloqueo();
                }).catch(() => {});
            }
        }

        // Clic invisible automático al cargar la página para activar el audio inmediatamente
        function dispararClickInvisible() {
            if (modoRespiroActivo) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const ctxAudio = new AudioCtx();
                    ctxAudio.resume().catch(() => {});
                }
            } catch (e) {}

            const evt = new MouseEvent('click', {
                view: window,
                bubbles: true,
                cancelable: true
            });
            document.body.dispatchEvent(evt);
            intentarReproducirIndex();
        }

        // Ejecutar intento de reproducción y clic invisible apenas cargue
        intentarReproducirIndex();
        bgMusic.addEventListener('canplay', () => {
            if (!modoRespiroActivo) intentarReproducirIndex();
        }, { once: true });
        window.addEventListener('DOMContentLoaded', dispararClickInvisible);
        window.addEventListener('load', dispararClickInvisible);

        // Si el navegador aún requiere interacción física, desbloquear en el primer toque/clic
        // (excepto si el clic es en "Tomar un respiro" o "Leer / Continuar")
        function desbloquearAlInstante(e) {
            if (modoRespiroActivo) {
                eliminarEventosDesbloqueo();
                return;
            }
            if (e && e.target && e.target.closest) {
                if (e.target.closest('#close-btn')) {
                    // Si lo primero que toca es "Tomar un respiro", destruimos el audio del index de inmediato
                    modoRespiroActivo = true;
                    detenerYDestruirAudioIndex();
                    return;
                }
                if (e.target.closest('.btn-primary') || e.target.closest('#music-btn')) {
                    return;
                }
            }
            if (bgMusic.paused && !modoRespiroActivo) {
                intentarReproducirIndex();
            }
        }
        eventosDesbloqueo.forEach(ev => window.addEventListener(ev, desbloquearAlInstante, { passive: true }));

        // =========================================================================
        // BOTÓN "TOMAR UN RESPIRO": PANTALLA NEGRA -> MENSAJE -> VIDEO + MÚSICA NUEVA
        // =========================================================================
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            modoRespiroActivo = true;

            // 1. Eliminar por completo el audio del index para que NUNCA se mezcle ni siga sonando
            detenerYDestruirAudioIndex();

            // 2. Desbloquear el video (siempre mudo) y el nuevo audio en el mismo instante del clic
            //    para que a los 5.2 segundos arranquen solos sin necesidad de tocar la pantalla
            respiroVideo.muted = true;
            respiroVideo.play().then(() => {
                respiroVideo.pause();
                respiroVideo.currentTime = 0;
            }).catch(() => {});

            respiroMusic.volume = 0;
            respiroMusic.muted = false;
            respiroMusic.play().then(() => {
                respiroMusic.pause();
                respiroMusic.currentTime = 0;
                respiroMusic.volume = 1.0;
                respiroMusic.muted = estadoSilenciado;
            }).catch(() => {});

            // 3. Poner pantalla en negro
            closedScreen.classList.add('active');

            // 4. Hacer aparecer el mensaje en la pantalla negra
            setTimeout(() => {
                closedScreen.classList.add('show-msg');
            }, 400);

            // 5. Hacer desaparecer el mensaje después de unos segundos
            setTimeout(() => {
                closedScreen.classList.remove('show-msg');
            }, 3800);

            // 6. Mostrar el video a pantalla completa, reproducir únicamente la música del respiro
            //    y mostrar arriba el mensaje durante 25 segundos
            setTimeout(() => {
                videoScene.classList.add('active');

                respiroVideo.muted = true;
                respiroVideo.currentTime = 0;
                respiroVideo.play().catch(() => {});

                respiroMusic.currentTime = 0;
                respiroMusic.volume = 1.0;
                respiroMusic.muted = estadoSilenciado;
                respiroMusic.play().catch(() => {});
                actualizarEstadoBotonMute();

                // Aparece el mensaje superior
                setTimeout(() => {
                    respiroTopMsg.classList.add('visible');

                    // Desaparece después de 25 segundos (25000 ms)
                    setTimeout(() => {
                        respiroTopMsg.classList.remove('visible');
                    }, 25000);
                }, 600);
            }, 5200);
        });

        // El único botón solo silencia o reactiva el sonido activo actual
        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const audioActivo = modoRespiroActivo ? respiroMusic : bgMusic;
            if (audioActivo.paused) {
                estadoSilenciado = false;
                audioActivo.muted = false;
                audioActivo.volume = 1.0;
                audioActivo.play().catch(() => {});
            } else {
                estadoSilenciado = !estadoSilenciado;
                audioActivo.muted = estadoSilenciado;
            }
            actualizarEstadoBotonMute();
        });

        // =========================================================================
        // PARTÍCULAS DE FONDO (LUCES SUAVES FLOTANDO)
        // =========================================================================
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = -(Math.random() * 0.35 + 0.1);
                this.speedX = (Math.random() - 0.5) * 0.25;
                this.alpha = Math.random() * 0.45 + 0.05;
                this.fadeSpeed = Math.random() * 0.004 + 0.001;
                this.growing = Math.random() > 0.5;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.growing) {
                    this.alpha += this.fadeSpeed;
                    if (this.alpha >= 0.55) this.growing = false;
                } else {
                    this.alpha -= this.fadeSpeed;
                    if (this.alpha <= 0.05) this.growing = true;
                }

                if (this.y < -20) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 180, 153, ${this.alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(212, 180, 153, 0.5)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 55; i++) {
            particlesArray.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
